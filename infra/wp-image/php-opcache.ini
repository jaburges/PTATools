; OPcache tuning for an immutable container image.
;
; validate_timestamps=0 is only safe because wp-content is baked into the image
; and never edited in place. A code change means a new image and a new revision,
; which starts a fresh process with a cold cache. Never enable in-dashboard
; plugin editing against this image — the change would be invisible until
; restart, and lost on the next deploy.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; The front page alone loads ~1,800 files and wp-admin loads considerably more,
; so the default ceiling of 10000 is raised to leave headroom.
opcache.max_accelerated_files=30000
opcache.memory_consumption=256
opcache.interned_strings_buffer=32

; Saves recompilation across worker processes on cold start.
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0

opcache.max_wasted_percentage=10
opcache.huge_code_pages=0
