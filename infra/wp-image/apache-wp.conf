# WordPress rewrite rules, baked into the image.
#
# These live here rather than in a .htaccess file so Apache does not have to
# look for per-directory overrides on every request, and so the container needs
# no custom startup command to write them.
<Directory /var/www/html>
    AllowOverride None

    RewriteEngine On
    RewriteBase /

    # Only Front Door may reach this container. Container Apps ingress cannot
    # filter on headers and does not accept service tags, so the check has to
    # happen here. Without it the ACA hostname is a way round the WAF, the rate
    # limiting and any future edge caching.
    #
    # The FDID identifies this Front Door profile. It is not a secret — it stops
    # casual and automated direct access, not somebody who has read the headers.
    #
    # Two paths stay open on purpose, and breaking either is silent:
    #   /wp-cron.php  the wilderptsa-wpcron job calls the ACA hostname directly,
    #                 and all scheduled work stops if it starts getting 403s,
    #                 including the OneDrive backup queue.
    #   /healthz.php  the Front Door origin health probe, which is what decides
    #                 whether the origin is considered up at all.
    RewriteCond %{HTTP:X-Azure-FDID} !=863cc6c3-7117-4e08-9159-c86b5feb4911
    RewriteCond %{REQUEST_URI} !^/(?:wp-cron|healthz)\.php$
    RewriteRule ^ - [F,L]

    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]
</Directory>

# Never hand out the object cache drop-in or other PHP under uploads: that
# directory is writable at runtime, so treating it as executable would turn a
# media upload into remote code execution.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(?:php|phar|phtml)$">
        Require all denied
    </FilesMatch>
</Directory>

# Static assets are versioned by the theme's cache-busting query strings, so they
# are safe to cache in the browser for a long time.
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css                  "access plus 1 year"
    ExpiresByType application/javascript    "access plus 1 year"
    ExpiresByType text/javascript           "access plus 1 year"
    ExpiresByType image/png                 "access plus 1 year"
    ExpiresByType image/jpeg                "access plus 1 year"
    ExpiresByType image/gif                 "access plus 1 year"
    ExpiresByType image/webp                "access plus 1 year"
    ExpiresByType image/svg+xml             "access plus 1 year"
    ExpiresByType font/woff2                "access plus 1 year"
</IfModule>

# Keep the server from advertising more than it needs to.
ServerTokens Prod
ServerSignature Off
