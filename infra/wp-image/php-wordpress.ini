; Matches the limits the App Service deployment ran with, so behaviour does not
; change as part of the platform move.
memory_limit=512M
max_execution_time=300
max_input_vars=5000
post_max_size=64M
upload_max_filesize=64M

; wp-content lives on an immutable layer and uploads on an SMB mount, so path
; resolution is worth caching generously.
realpath_cache_size=4096K
realpath_cache_ttl=600

expose_php=Off
display_errors=Off
log_errors=On
error_log=/dev/stderr
