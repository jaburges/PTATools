# Moves @wilderptsa.net accounts from the editor role onto azuread ("Azure AD
# User"), so the WordPress role records how an account authenticates.
#
# Safe to re-run: it reports what it would change and writes nothing unless
# DRY_RUN is set to "0". Applied against wilderptsa.net on 2026-08-03, which
# moved 31 accounts and dropped 1 redundant editor role, taking azuread from
# 15 users to 46. Kept for future drift and for lwptsa.net.
#
# Deliberately out of scope:
#   - administrators, because converting them would strip admin access
#     (jamieb@ and admin@ among them)
#   - parent / bbp_participant accounts, because azuread now carries editor
#     capabilities, so moving them would be a privilege escalation rather than
#     the like-for-like swap it is for editors
#
# Requires plugin >= 3.143.4, which is what gave azuread editor capabilities.
# Running it before that would leave 31 people unable to edit anything.
location: westus2
identity:
  type: UserAssigned
  userAssignedIdentities:
    "/subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca": {}
properties:
  environmentId: "/subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourceGroups/PTSAWebsite/providers/Microsoft.App/managedEnvironments/wilderptsa-aca-env"
  workloadProfileName: Consumption
  configuration:
    triggerType: Manual
    replicaTimeout: 1800
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: db-password
        keyVaultUrl: "https://kv-wilderptsa-cad4c2.vault.azure.net/secrets/mysql-small-ptsadbadmin-password"
        identity: "/subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca"
  template:
    containers:
      - name: wpcli
        image: "docker.io/library/wordpress:cli-php8.3"
        resources:
          cpu: 1.0
          memory: 2.0Gi
        env:
          - name: DB_PASSWORD
            secretRef: db-password
          # "1" reports what would change and writes nothing. Set to "0" to apply.
          - name: DRY_RUN
            value: "1"
        command: ["/bin/sh"]
        args:
          - "-c"
          - |
            set -e
            WPBIN="php -d memory_limit=1024M /usr/local/bin/wp"
            WP="$WPBIN --path=/tmp/wp --skip-plugins --skip-themes"
            mkdir -p /tmp/wp
            $WPBIN core download --path=/tmp/wp --version=7.0.2 --force --quiet
            $WPBIN config create --path=/tmp/wp \
              --dbname=wilderptsa_wp \
              --dbuser=ptsadbadmin \
              --dbpass="$DB_PASSWORD" \
              --dbhost=wilderptsa-wpdb-small.mysql.database.azure.com \
              --dbcharset=utf8mb4 \
              --skip-check --force --quiet --extra-php <<'PHP'
            define( 'MYSQL_CLIENT_FLAGS', MYSQLI_CLIENT_SSL );
            PHP

            # Roles come from the wp_user_roles option, so azuread resolves even
            # with plugins skipped. Skipping them is deliberate: this must not
            # fire SSO or membership side effects while reassigning roles.
            # Written to a file rather than piped: wp eval-file cannot read
            # /dev/stdin from inside the phar.
            cat > /tmp/migrate.php <<'PHP'
            <?php
            $dry = getenv( 'DRY_RUN' ) !== '0';

            global $wpdb;
            $ids = $wpdb->get_col(
                "SELECT ID FROM {$wpdb->users}
                  WHERE user_email LIKE '%@wilderptsa.net'
                  ORDER BY user_email"
            );

            if ( ! wp_roles()->is_role( 'azuread' ) ) {
                WP_CLI::error( 'The azuread role does not exist; deploy the plugin first.' );
            }

            $moved = $skipped_admin = $skipped_no_editor = $already = $deduped = 0;

            printf( "%-6s %-30s %-34s %s\n", 'ID', 'EMAIL', 'ROLES BEFORE', 'ACTION' );

            foreach ( $ids as $id ) {
                $user = new WP_User( $id );
                $before = implode( ',', $user->roles );

                /* Administrators are left alone. Moving them would strip admin
                   access, and this list includes the accounts used to administer
                   the site. */
                if ( in_array( 'administrator', $user->roles, true ) ) {
                    $action = 'skip (administrator)';
                    $skipped_admin++;
                } elseif ( in_array( 'azuread', $user->roles, true ) ) {
                    if ( in_array( 'editor', $user->roles, true ) ) {
                        /* Holding both is redundant now that they carry the same
                           capabilities, and it muddies the signal the role is
                           there to give. Dropping editor changes nothing. */
                        $action = $dry ? 'WOULD drop redundant editor' : 'dropped redundant editor';
                        if ( ! $dry ) {
                            $user->remove_role( 'editor' );
                        }
                        $deduped++;
                    } else {
                        $action = 'skip (already azuread)';
                        $already++;
                    }
                } elseif ( ! in_array( 'editor', $user->roles, true ) ) {
                    /* parent / bbp_participant accounts are out of scope: azuread
                       now carries editor capabilities, so moving them would be a
                       privilege escalation rather than a like-for-like swap. */
                    $action = 'skip (not editor)';
                    $skipped_no_editor++;
                } else {
                    $action = $dry ? 'WOULD move editor -> azuread' : 'moved editor -> azuread';
                    if ( ! $dry ) {
                        /* Added before removed so the account is never left
                           without a role, and only editor is removed so
                           bbp_participant and parent survive. */
                        $user->add_role( 'azuread' );
                        $user->remove_role( 'editor' );
                    }
                    $moved++;
                }

                printf( "%-6d %-30s %-34s %s\n", $id, $user->user_email, $before, $action );
            }

            printf(
                "\n%s\nmoved: %d | redundant editor dropped: %d | already azuread: %d | admins skipped: %d | not editor: %d | total: %d\n",
                $dry ? '=== DRY RUN, nothing written ===' : '=== APPLIED ===',
                $moved, $deduped, $already, $skipped_admin, $skipped_no_editor, count( $ids )
            );
            PHP
            $WP eval-file /tmp/migrate.php
            echo ROLE_MIGRATE_OK
