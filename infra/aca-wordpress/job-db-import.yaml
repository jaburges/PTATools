location: westus2
identity:
  type: UserAssigned
  userAssignedIdentities:
    "/subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca": {}
properties:
  environmentId: "/subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourceGroups/PTSAWebsite/providers/Microsoft.App/managedEnvironments/wilderptsa-aca-env"
  workloadProfileName: Consumption
  configuration:
    triggerType: Manual
    # An 18 MB / 92-table import finishes in well under a minute, but the
    # ceiling is generous because a partial import is worse than a slow one.
    replicaTimeout: 1800
    # Deliberately no retries: re-running a half-applied import compounds the
    # damage rather than fixing it.
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: db-password
        keyVaultUrl: "https://kv-wilderptsa-cad4c2.vault.azure.net/secrets/mysql-small-ptsadbadmin-password"
        identity: "/subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca"
  template:
    volumes:
      - name: migration
        storageType: AzureFile
        storageName: migrationfiles
    containers:
      # Runs inside the VNet, which is the only place the MySQL private endpoint
      # resolves. The workstation that produced the dump cannot reach it.
      - name: importer
        image: "docker.io/library/mysql:8"
        resources:
          cpu: 1.0
          memory: 2.0Gi
        volumeMounts:
          - volumeName: migration
            mountPath: /mnt/migration
        env:
          # MYSQL_PWD keeps the password out of the process list and job logs.
          - name: MYSQL_PWD
            secretRef: db-password
        command: ["/bin/sh"]
        args:
          - "-c"
          - >-
            set -e;
            echo "verifying source file";
            ls -l /mnt/migration/wp-new-site.sql;
            echo "importing into wilderptsa_wp";
            mysql --host=wilderptsa-wpdb-small.mysql.database.azure.com
            --user=ptsadbadmin
            --ssl-mode=REQUIRED
            --default-character-set=utf8mb4
            wilderptsa_wp < /mnt/migration/wp-new-site.sql;
            echo "verifying row counts";
            mysql --host=wilderptsa-wpdb-small.mysql.database.azure.com
            --user=ptsadbadmin --ssl-mode=REQUIRED -N -B
            -e "SELECT CONCAT('tables=', COUNT(*)) FROM information_schema.tables WHERE table_schema='wilderptsa_wp';
            SELECT CONCAT('posts=', COUNT(*)) FROM wilderptsa_wp.wp_posts;
            SELECT CONCAT('users=', COUNT(*)) FROM wilderptsa_wp.wp_users;
            SELECT CONCAT('siteurl=', option_value) FROM wilderptsa_wp.wp_options WHERE option_name='siteurl';";
            echo IMPORT_OK
