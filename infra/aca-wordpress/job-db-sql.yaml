location: westus2
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca
    : {}
properties:
  environmentId: /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourceGroups/PTSAWebsite/providers/Microsoft.App/managedEnvironments/wilderptsa-aca-env
  workloadProfileName: Consumption
  configuration:
    triggerType: Manual
    replicaTimeout: 1800
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
    - name: db-password
      keyVaultUrl: https://kv-wilderptsa-cad4c2.vault.azure.net/secrets/mysql-small-ptsadbadmin-password
      identity: /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca
  template:
    containers:
    - name: sql
      image: docker.io/library/mysql:8
      resources:
        cpu: 0.5
        memory: 1.0Gi
      env:
      - name: MYSQL_PWD
        secretRef: db-password
      command:
      - /bin/sh
      args:
      - -c
      - "set -e\nmysql --host=wilderptsa-wpdb-small.mysql.database.azure.com \\\n  --user=ptsadbadmin\
        \ --ssl-mode=REQUIRED --default-character-set=utf8mb4 \\\n  -t wilderptsa_wp <<'SQL'\nSELECT option_name,\
        \ LENGTH(option_value) AS len\n  FROM wp_options\n WHERE option_value LIKE '%wp.theburgessfamily.us%';\n\
        \n/* JSON-encoded values escape the slashes, so a plain https:// search\n   never matches them.\
        \ Count that form separately. */\nSELECT 'json_escaped_options' AS form, COUNT(*) AS n\n  FROM\
        \ wp_options WHERE option_value LIKE '%wp.theburgessfamily.us%'\n                    AND option_value\
        \ LIKE '%:\\\\/\\\\/%'\nUNION ALL\nSELECT 'json_escaped_posts', COUNT(*) FROM wp_posts\n WHERE\
        \ post_content LIKE '%:\\\\/\\\\/wp.theburgessfamily.us%';\n\nSELECT option_name,\n       SUBSTRING(option_value,\
        \ GREATEST(1, LOCATE('wp.theburgessfamily.us', option_value) - 40), 110) AS context\n  FROM wp_options\n\
        \ WHERE option_value LIKE '%wp.theburgessfamily.us%';\nSQL\necho QUERY_OK\n"
