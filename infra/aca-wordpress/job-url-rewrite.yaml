location: westus2
identity:
  type: UserAssigned
  userAssignedIdentities:
    "/subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca": {}
properties:
  environmentId: "/subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourceGroups/PTSAWebsite/providers/Microsoft.App/managedEnvironments/wilderptsa-aca-env"
  workloadProfileName: Consumption
  configuration:
    triggerType: Manual
    replicaTimeout: 3600
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: db-password
        keyVaultUrl: "https://kv-wilderptsa-cad4c2.vault.azure.net/secrets/mysql-small-ptsadbadmin-password"
        identity: "/subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca"
  template:
    containers:
      # WP-CLI rather than SQL REPLACE(): three of the affected options hold
      # serialized PHP, where a raw string swap corrupts the length prefixes.
      # search-replace unserializes, substitutes, and re-serializes correctly.
      - name: wpcli
        image: "docker.io/library/wordpress:cli-php8.3"
        resources:
          cpu: 1.0
          memory: 2.0Gi
        env:
          - name: DB_PASSWORD
            secretRef: db-password
          # Cutover run, 2026-08-03: moving content off the container's own
          # hostname and onto the public domain. The previous run moved it from
          # wp.theburgessfamily.us to the container host, which is why the
          # container host is what needs replacing now.
          - name: OLD_URL
            value: "https://wilderptsa-wp.wittysky-40aa8bc1.westus2.azurecontainerapps.io"
          - name: NEW_URL
            value: "https://wilderptsa.net"
          - name: OLD_HOST
            value: "wilderptsa-wp.wittysky-40aa8bc1.westus2.azurecontainerapps.io"
          - name: NEW_HOST
            value: "wilderptsa.net"
          # One options row still holds the original migration host.
          - name: LEGACY_HOST
            value: "wp.theburgessfamily.us"
        command: ["/bin/sh"]
        args:
          - "-c"
          - |
            set -e
            # /usr/local/bin/wp is the phar itself, not the shell wrapper, so
            # WP_CLI_PHP_ARGS is ignored and the 128M default applies. Calling
            # php directly is the only way to raise the limit, which both core
            # extraction and a --precise replace over 1,769 posts need.
            WPBIN="php -d memory_limit=1024M /usr/local/bin/wp"
            WP="$WPBIN --path=/tmp/wp --skip-plugins --skip-themes"
            echo "=== staging a core checkout for CLI bootstrap ==="
            # search-replace is pure database work, but WP-CLI still needs core
            # plus a config to bootstrap. Plugins and themes stay unloaded so
            # this cannot fire hooks against a half-migrated site.
            mkdir -p /tmp/wp
            $WPBIN core download --path=/tmp/wp --version=6.9.4 --force --quiet
            # MYSQL_CLIENT_FLAGS mirrors the live container. Azure MySQL runs
            # require_secure_transport=ON, and while `wp db check` succeeds by
            # shelling out to the mysql client (which negotiates TLS itself),
            # WordPress's own mysqli connection fails without this flag.
            $WPBIN config create --path=/tmp/wp \
              --dbname=wilderptsa_wp \
              --dbuser=ptsadbadmin \
              --dbpass="$DB_PASSWORD" \
              --dbhost=wilderptsa-wpdb-small.mysql.database.azure.com \
              --dbcharset=utf8mb4 \
              --skip-check --force --quiet --extra-php <<'PHP'
            define( 'MYSQL_CLIENT_FLAGS', MYSQLI_CLIENT_SSL );
            PHP
            echo "=== connectivity check ==="
            $WP db check || true
            echo "current siteurl: $($WP option get siteurl)"
            echo
            echo "=== DRY RUN: what would change ==="
            $WP search-replace "$OLD_URL" "$NEW_URL" \
              --all-tables --precise --report-changed-only --dry-run
            echo
            echo "=== APPLYING ==="
            $WP search-replace "$OLD_URL" "$NEW_URL" \
              --all-tables --precise --report-changed-only
            echo
            echo "=== also normalising any http:// form ==="
            $WP search-replace "http://$OLD_HOST" "$NEW_URL" \
              --all-tables --precise --report-changed-only || true
            echo
            # Catches protocol-relative (//host/…) and bare mentions that the
            # scheme-prefixed passes above cannot see.
            echo "=== bare host references ==="
            $WP search-replace "$OLD_HOST" "$NEW_HOST" \
              --all-tables --precise --report-changed-only || true
            echo
            echo "=== leftovers from the original migration host ==="
            for scheme in "https://" "http://"; do
              $WP search-replace "$scheme$LEGACY_HOST" "$NEW_URL" \
                --all-tables --precise --report-changed-only || true
            done
            $WP search-replace "$LEGACY_HOST" "$NEW_HOST" \
              --all-tables --precise --report-changed-only || true
            echo
            echo "=== clearing transients (they cached old-host asset URLs) ==="
            $WP transient delete --all || true
            echo
            echo "=== verification ==="
            echo "siteurl: $($WP option get siteurl)"
            echo "home:    $($WP option get home)"
            $WP db query "SELECT 'posts_content_remaining', COUNT(*) FROM wp_posts WHERE post_content LIKE '%$OLD_HOST%';" --skip-column-names
            $WP db query "SELECT 'posts_guid_remaining', COUNT(*) FROM wp_posts WHERE guid LIKE '%$OLD_HOST%';" --skip-column-names
            $WP db query "SELECT 'options_remaining', COUNT(*) FROM wp_options WHERE option_value LIKE '%$OLD_HOST%';" --skip-column-names
            $WP db query "SELECT 'legacy_remaining', COUNT(*) FROM wp_options WHERE option_value LIKE '%$LEGACY_HOST%';" --skip-column-names
            echo REWRITE_OK
