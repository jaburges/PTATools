location: westus2
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca
    : {}
properties:
  environmentId: /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourceGroups/PTSAWebsite/providers/Microsoft.App/managedEnvironments/wilderptsa-aca-env
  workloadProfileName: Consumption
  configuration:
    triggerType: Manual
    replicaTimeout: 900
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: db-password
        keyVaultUrl: https://kv-wilderptsa-cad4c2.vault.azure.net/secrets/mysql-small-ptsadbadmin-password
        identity: /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca
  template:
    containers:
      - name: sql
        image: docker.io/library/mysql:8
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: MYSQL_PWD
            secretRef: db-password
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -e
            mysql --host=wilderptsa-wpdb-small.mysql.database.azure.com \
              --user=ptsadbadmin --ssl-mode=REQUIRED --default-character-set=utf8mb4 \
              -t wilderptsa_wp <<'SQL'
            /* Scratch query slot. Overwrite the body for one-off investigation;
               keep it read-only. Note user variables carry the connection
               collation and clash with these tables' utf8mb4_unicode_520_ci on
               LIKE — use string literals instead. */

            /* Roster maths the assignments modal will display. */
            SELECT r.id, r.name, d.name AS dept, r.max_occupants,
                   COUNT(a.id) AS assigned,
                   GREATEST(0, r.max_occupants - COUNT(a.id)) AS open_positions
              FROM wp_pta_roles r
              JOIN wp_pta_departments d ON d.id = r.department_id
              LEFT JOIN wp_pta_role_assignments a
                     ON a.role_id = r.id AND a.status = 'active'
             GROUP BY r.id, r.name, d.name, r.max_occupants
             ORDER BY open_positions DESC, r.name
             LIMIT 12;

            SELECT SUM(max_occupants) AS total_positions FROM wp_pta_roles;

            SELECT COUNT(*) AS active_assignments
              FROM wp_pta_role_assignments WHERE status = 'active';

            /* Multiple active rows for the same person+role would break the
               roster's one-row-per-slot assumption. */
            SELECT COUNT(*) AS duplicate_active_pairs FROM (
              SELECT user_id, role_id FROM wp_pta_role_assignments
               WHERE status = 'active'
               GROUP BY user_id, role_id HAVING COUNT(*) > 1
            ) dupes;

            /* Over-subscribed roles would render negative open space. */
            SELECT COUNT(*) AS overfilled_roles FROM (
              SELECT r.id FROM wp_pta_roles r
                LEFT JOIN wp_pta_role_assignments a
                       ON a.role_id = r.id AND a.status = 'active'
               GROUP BY r.id, r.max_occupants
              HAVING COUNT(a.id) > r.max_occupants
            ) o;

            SQL
            echo QUERY_OK
