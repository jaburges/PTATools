location: westus2
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca
    : {}
properties:
  environmentId: /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourceGroups/PTSAWebsite/providers/Microsoft.App/managedEnvironments/wilderptsa-aca-env
  workloadProfileName: Consumption
  configuration:
    triggerType: Manual
    replicaTimeout: 900
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: db-password
        keyVaultUrl: https://kv-wilderptsa-cad4c2.vault.azure.net/secrets/mysql-small-ptsadbadmin-password
        identity: /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca
  template:
    containers:
      - name: sql
        image: docker.io/library/mysql:8
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: MYSQL_PWD
            secretRef: db-password
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -e
            mysql --host=wilderptsa-wpdb-small.mysql.database.azure.com \
              --user=ptsadbadmin --ssl-mode=REQUIRED --default-character-set=utf8mb4 \
              -t wilderptsa_wp <<'SQL'
            /* Scratch query slot. Overwrite the body for one-off investigation;
               keep it read-only. Note user variables carry the connection
               collation and clash with these tables' utf8mb4_unicode_520_ci on
               LIKE — use string literals instead. */

            /* What the database thinks the site's address is. */
            SELECT option_name, option_value FROM wp_options
             WHERE option_name IN ('siteurl','home');

            /* Absolute URLs baked into content, by flavour, so the rewrite is
               aimed at whatever is actually there. */
            SELECT 'posts_container' AS what, COUNT(*) AS rows_affected
              FROM wp_posts WHERE post_content LIKE '%azurecontainerapps.io%'
            UNION ALL SELECT 'posts_guid_container', COUNT(*)
              FROM wp_posts WHERE guid LIKE '%azurecontainerapps.io%'
            UNION ALL SELECT 'options_container', COUNT(*)
              FROM wp_options WHERE option_value LIKE '%azurecontainerapps.io%'
            UNION ALL SELECT 'postmeta_container', COUNT(*)
              FROM wp_postmeta WHERE meta_value LIKE '%azurecontainerapps.io%'
            UNION ALL SELECT 'posts_burgess', COUNT(*)
              FROM wp_posts WHERE post_content LIKE '%theburgessfamily%'
            UNION ALL SELECT 'options_burgess', COUNT(*)
              FROM wp_options WHERE option_value LIKE '%theburgessfamily%'
            UNION ALL SELECT 'posts_wilderptsa_net', COUNT(*)
              FROM wp_posts WHERE post_content LIKE '%wilderptsa.net%';

            SQL
            echo QUERY_OK
