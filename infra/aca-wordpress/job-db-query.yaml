location: westus2
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca
    : {}
properties:
  environmentId: /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourceGroups/PTSAWebsite/providers/Microsoft.App/managedEnvironments/wilderptsa-aca-env
  workloadProfileName: Consumption
  configuration:
    triggerType: Manual
    replicaTimeout: 900
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: db-password
        keyVaultUrl: https://kv-wilderptsa-cad4c2.vault.azure.net/secrets/mysql-small-ptsadbadmin-password
        identity: /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca
  template:
    containers:
      - name: sql
        image: docker.io/library/mysql:8
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: MYSQL_PWD
            secretRef: db-password
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -e
            mysql --host=wilderptsa-wpdb-small.mysql.database.azure.com \
              --user=ptsadbadmin --ssl-mode=REQUIRED --default-character-set=utf8mb4 \
              -t wilderptsa_wp <<'SQL'
            /* Scratch query slot. Overwrite the body for one-off investigation;
               keep it read-only. Note user variables carry the connection
               collation and clash with these tables' utf8mb4_unicode_520_ci on
               LIKE — use string literals instead. */

            /* Which module flags are present in the settings, and their values. */
            SELECT 'enable_auction' AS flag, SUBSTRING(option_value, LOCATE('enable_auction', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_backup' AS flag, SUBSTRING(option_value, LOCATE('enable_backup', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_calendar' AS flag, SUBSTRING(option_value, LOCATE('enable_calendar', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_classes' AS flag, SUBSTRING(option_value, LOCATE('enable_classes', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_donations' AS flag, SUBSTRING(option_value, LOCATE('enable_donations', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_email' AS flag, SUBSTRING(option_value, LOCATE('enable_email', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_newsletter' AS flag, SUBSTRING(option_value, LOCATE('enable_newsletter', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_onedrive_media' AS flag, SUBSTRING(option_value, LOCATE('enable_onedrive_media', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_product_fields' AS flag, SUBSTRING(option_value, LOCATE('enable_product_fields', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_pta' AS flag, SUBSTRING(option_value, LOCATE('enable_pta', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_sso' AS flag, SUBSTRING(option_value, LOCATE('enable_sso', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings'
            UNION ALL
            SELECT 'enable_volunteer' AS flag, SUBSTRING(option_value, LOCATE('enable_volunteer', option_value), 60) AS snippet FROM wp_options WHERE option_name='azure_plugin_settings';

            SQL
            echo QUERY_OK
