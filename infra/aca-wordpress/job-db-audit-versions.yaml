location: westus2
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca
    : {}
properties:
  environmentId: /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourceGroups/PTSAWebsite/providers/Microsoft.App/managedEnvironments/wilderptsa-aca-env
  workloadProfileName: Consumption
  configuration:
    triggerType: Manual
    replicaTimeout: 900
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    secrets:
      - name: db-password
        keyVaultUrl: https://kv-wilderptsa-cad4c2.vault.azure.net/secrets/mysql-small-ptsadbadmin-password
        identity: /subscriptions/97f6936d-7300-4a49-a2ad-cbfee3b28e00/resourcegroups/PTSAWebsite/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-wilderptsa-aca
  template:
    containers:
      - name: sql
        image: docker.io/library/mysql:8
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: MYSQL_PWD
            secretRef: db-password
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -e
            mysql --host=wilderptsa-wpdb-small.mysql.database.azure.com \
              --user=ptsadbadmin --ssl-mode=REQUIRED --default-character-set=utf8mb4 \
              -t wilderptsa_wp <<'SQL'
            /* Read-only pre-cutover check. Two things to confirm:

               1. The WordPress version in the database matches the version in
                  the image. Core cannot persist an update applied from wp-admin,
                  but its schema upgrade can, and wp-admin compares the two for
                  inequality — so a database left ahead of the files sends every
                  admin page to upgrade.php.
                    6.9.4 = 60717    7.0.2 = 61833

               2. How much content still carries the container hostname as an
                  absolute URL. WP_HOME and WP_SITEURL are derived per request so
                  they need no change, but URLs baked into post content do, or the
                  public site will hotlink azurecontainerapps.io after cutover. */
            SELECT option_name, option_value
              FROM wp_options
             WHERE option_name IN ('db_version','initial_db_version','siteurl','home');

            SELECT 'posts_content' AS location, COUNT(*) AS rows_affected
              FROM wp_posts   WHERE post_content LIKE '%wilderptsa-wp.wittysky-40aa8bc1.westus2.azurecontainerapps.io%'
            UNION ALL
            SELECT 'posts_excerpt', COUNT(*) FROM wp_posts
             WHERE post_excerpt LIKE '%wilderptsa-wp.wittysky-40aa8bc1.westus2.azurecontainerapps.io%'
            UNION ALL
            SELECT 'postmeta', COUNT(*) FROM wp_postmeta
             WHERE meta_value LIKE '%wilderptsa-wp.wittysky-40aa8bc1.westus2.azurecontainerapps.io%'
            UNION ALL
            SELECT 'options', COUNT(*) FROM wp_options
             WHERE option_value LIKE '%wilderptsa-wp.wittysky-40aa8bc1.westus2.azurecontainerapps.io%'
            UNION ALL
            SELECT 'termmeta', COUNT(*) FROM wp_termmeta
             WHERE meta_value LIKE '%wilderptsa-wp.wittysky-40aa8bc1.westus2.azurecontainerapps.io%'
            UNION ALL
            SELECT 'usermeta', COUNT(*) FROM wp_usermeta
             WHERE meta_value LIKE '%wilderptsa-wp.wittysky-40aa8bc1.westus2.azurecontainerapps.io%';

            /* Which posts, so the rewrite can be spot-checked afterwards. */
            SELECT ID, post_type, post_status, LEFT(post_title, 42) AS title
              FROM wp_posts
             WHERE post_content LIKE '%wilderptsa-wp.wittysky-40aa8bc1.westus2.azurecontainerapps.io%'
             ORDER BY ID
             LIMIT 25;
            SQL
            echo QUERY_OK
